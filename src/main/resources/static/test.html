<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hashnode Blog</title>

    <link rel="stylesheet" href="style.css">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f8fc;
            color: #202124;
        }

        /* Navbar */

        .navbar {
            height: 70px;
            background: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 7%;
            border-bottom: 1px solid #e5e7eb;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
            color: #2962ff;
        }

        .navbar a {
            text-decoration: none;
            color: #444;
            margin-left: 25px;
            font-weight: 500;
        }

        .navbar a:hover {
            color: #2962ff;
        }

        .logout-btn {
            margin-left: 20px;
            padding: 9px 18px;
            border: none;
            border-radius: 8px;
            background: #ef4444;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        .logout-btn:hover {
            background: #dc2626;
        }

        /* Hero */

        .hero {
            text-align: center;
            padding: 60px 20px 35px;
        }

        .hero h1 {
            font-size: 42px;
            margin-bottom: 12px;
            color: #111827;
        }

        .hero p {
            color: #6b7280;
            font-size: 17px;
        }

        /* Container */

        .container {
            width: 90%;
            max-width: 1000px;
            margin: auto;
        }

        /* Search */

        .search-box {
            background: white;
            padding: 20px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            margin-bottom: 30px;
        }

        .search-box input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 9px;
            font-size: 16px;
            outline: none;
        }

        .search-box input:focus {
            border-color: #2962ff;
        }

        /* Create Post */

        .create-box {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.07);
            margin-bottom: 40px;
        }

        .create-box h2 {
            margin-top: 0;
            color: #111827;
        }

        .create-box input,
        .create-box textarea {
            width: 100%;
            padding: 14px;
            margin-top: 12px;
            border: 1px solid #ddd;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
            font-family: Arial, sans-serif;
        }

        .create-box input:focus,
        .create-box textarea:focus {
            border-color: #2962ff;
        }

        .create-btn {
            margin-top: 15px;
            padding: 12px 24px;
            background: #2962ff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
        }

        .create-btn:hover {
            background: #1749d1;
        }

        /* Posts */

        .posts-heading {
            margin-bottom: 20px;
            font-size: 28px;
        }

        .post-card {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            border: 1px solid #eee;
        }

        .post-card h3 {
            margin-top: 0;
            font-size: 22px;
        }

        .post-card h3 a {
            text-decoration: none;
            color: #1d4ed8;
        }

        .post-card h3 a:hover {
            text-decoration: underline;
        }

        .post-card p {
            color: #555;
            line-height: 1.6;
        }

        .edit-btn {
            padding: 9px 18px;
            border: none;
            border-radius: 7px;
            background: #16a34a;
            color: white;
            cursor: pointer;
            margin-right: 8px;
            font-weight: bold;
        }

        .edit-btn:hover {
            background: #15803d;
        }

        .delete-btn {
            padding: 9px 18px;
            border: none;
            border-radius: 7px;
            background: #ef4444;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        .delete-btn:hover {
            background: #dc2626;
        }

        /* Footer */

        footer {
            margin-top: 60px;
            padding: 25px;
            text-align: center;
            background: #111827;
            color: white;
        }

        @media (max-width: 700px) {

            .navbar {
                padding: 0 20px;
            }

            .navbar a {
                margin-left: 8px;
                font-size: 13px;
            }

            .logout-btn {
                margin-left: 8px;
                padding: 7px 10px;
            }

            .hero h1 {
                font-size: 32px;
            }

        }

    </style>

</head>


<body>


    <!-- Navigation -->

    <nav class="navbar">

        <div class="logo">
            Hashnode
        </div>

        <div>

            <a href="test.html">Home</a>

            <a href="register.html">Register</a>

            <a href="login.html">Login</a>

            <button class="logout-btn" onclick="logout()">
                Logout
            </button>

        </div>

    </nav>


    <!-- Hero Section -->

    <section class="hero">

        <h1>Share. Learn. Inspire.</h1>

        <p>
            A place where developers share knowledge,
            ideas and experiences.
        </p>

    </section>


    <!-- Main -->

    <div class="container">


        <!-- Search -->

        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="🔍 Search posts by title or content..."
                onkeyup="searchPosts()">

        </div>


        <!-- Create Post -->

        <div class="create-box">

            <h2>✍️ Create a New Post</h2>

            <input
                type="text"
                id="title"
                placeholder="Enter your post title">

            <textarea
                id="content"
                rows="6"
                placeholder="Write your thoughts, knowledge or experience..."></textarea>

            <button
                class="create-btn"
                onclick="createPost()">

                + Publish Post

            </button>

        </div>


        <!-- Posts -->

        <h2 class="posts-heading">
            Latest Posts
        </h2>

        <div id="posts">

            Loading posts...

        </div>

    </div>


    <!-- Footer -->

    <footer>

        © 2026 Hashnode Blog | Built with Java Spring Boot

    </footer>


    <script>


        let allPosts = [];


        // Load Posts

        function loadPosts() {

            fetch("/posts")

                .then(response => response.json())

                .then(data => {

                    allPosts = data;

                    displayPosts(allPosts);

                })

                .catch(error => {

                    console.log(error);

                    document.getElementById("posts").innerHTML =
                        "<p>Unable to load posts.</p>";

                });

        }


        // Display Posts

        function displayPosts(posts) {

            const postsDiv =
                document.getElementById("posts");

            postsDiv.innerHTML = "";


            if (posts.length === 0) {

                postsDiv.innerHTML =
                    "<p>No posts found.</p>";

                return;

            }


            posts.forEach(post => {

                const postDiv =
                    document.createElement("div");

                postDiv.className = "post-card";


                postDiv.innerHTML = `

                    <h3>

                        <a href="post.html?id=${post.id}">

                            ${post.title}

                        </a>

                    </h3>

                    <p>

                        ${post.content}

                    </p>

                    <button
                        class="edit-btn"
                        onclick="editPost(${post.id})">

                        ✏️ Edit

                    </button>

                    <button
                        class="delete-btn"
                        onclick="deletePost(${post.id})">

                        🗑️ Delete

                    </button>

                `;


                postsDiv.appendChild(postDiv);

            });

        }


        // Create Post

        function createPost() {

            const title =
                document.getElementById("title").value.trim();

            const content =
                document.getElementById("content").value.trim();


            if (title === "" || content === "") {

                alert("Please enter title and content.");

                return;

            }


            const post = {

                title: title,

                content: content

            };


            fetch("/posts", {

                method: "POST",

                headers: {

                    "Content-Type": "application/json"

                },

                body: JSON.stringify(post)

            })

            .then(response => response.json())

            .then(data => {

                alert("Post published successfully! 🎉");

                document.getElementById("title").value = "";

                document.getElementById("content").value = "";

                loadPosts();

            })

            .catch(error => {

                console.log(error);

                alert("Error creating post.");

            });

        }


        // Delete Post

        function deletePost(id) {

            if (!confirm(
                "Are you sure you want to delete this post?"
            )) {

                return;

            }


            fetch("/posts/" + id, {

                method: "DELETE"

            })

            .then(response => {

                if (!response.ok) {

                    throw new Error("Delete failed");

                }

                alert("Post deleted successfully!");

                loadPosts();

            })

            .catch(error => {

                console.log(error);

                alert("Error deleting post.");

            });

        }


        // Edit Post

        function editPost(id) {

            const newTitle =
                prompt("Enter new title:");

            const newContent =
                prompt("Enter new content:");


            if (
                newTitle === null ||
                newContent === null
            ) {

                return;

            }


            const post = {

                title: newTitle,

                content: newContent

            };


            fetch("/posts/" + id, {

                method: "PUT",

                headers: {

                    "Content-Type": "application/json"

                },

                body: JSON.stringify(post)

            })

            .then(response => {

                if (!response.ok) {

                    throw new Error("Update failed");

                }

                return response.json();

            })

            .then(data => {

                alert("Post updated successfully!");

                loadPosts();

            })

            .catch(error => {

                console.log(error);

                alert("Error updating post.");

            });

        }


        // Search Posts

        function searchPosts() {

            const searchText =
                document
                    .getElementById("searchInput")
                    .value
                    .toLowerCase();


            const filteredPosts =
                allPosts.filter(post =>

                    post.title
                        .toLowerCase()
                        .includes(searchText)

                    ||

                    post.content
                        .toLowerCase()
                        .includes(searchText)

                );


            displayPosts(filteredPosts);

        }


        // Logout

        function logout() {

            alert("Logged out successfully!");

            window.location.href = "login.html";

        }


        // Load Posts When Page Opens

        loadPosts();


    </script>


</body>

</html>
